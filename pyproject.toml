[project]
name = "pyrefactor"
version = "0.1.0"
description = "Interactive LibCST-based tree view and Extract-Function refactoring for Python files"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "libcst>=1.1",
    "textual>=0.60",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
pyrefactor = "pyrefactor.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyrefactor"]

[tool.setuptools.package-data]
pyrefactor = ["_recorder/*.py"]  # injected into the user's program to record real calls

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
